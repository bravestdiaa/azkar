<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-family:'Cairo',sans-serif;margin:0;background:#f3f4f6;color:#1f2937}
header{padding:14px;text-align:center;color:#fff}
header.morning{background:linear-gradient(135deg,#f59e0b,#f97316)}
header.evening{background:linear-gradient(135deg,#1e3a8a,#4c1d95)}
h1{margin:0;font-size:1.4rem}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tabs button{font-family:inherit;border:0;border-radius:20px;padding:6px 16px;background:rgba(255,255,255,.25);color:#fff;font-weight:700}
.tabs button.active{background:#fff;color:#111}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;padding:12px;min-height:0}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#main .card{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center}
.nav{padding-bottom:env(safe-area-inset-bottom)}
.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:6px}
.progress div{height:100%;background:#10b981;width:0;transition:width .3s}
.meta{text-align:center;font-size:.9rem;color:#6b7280;margin-bottom:10px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);min-height:220px;white-space:pre-line;font-size:1.25rem;font-weight:700;line-height:2.2;text-align:center}
.counter{margin:4px auto 14px;width:180px;height:56px;border-radius:12px;border:0;background:#10b981;color:#fff;font-family:inherit;font-size:1.6rem;font-weight:700;display:block;box-shadow:0 4px 0 #0a8a60,0 6px 10px rgba(0,0,0,.2)}
.counter:active{transform:translateY(4px);box-shadow:0 2px 0 #0a8a60,0 4px 8px rgba(0,0,0,.2)}
.rep{display:inline-block;margin-top:6px;margin-bottom:0;background:#f3f4f6;color:#6b7280;border-radius:14px;padding:2px 10px;font-size:.85rem;font-weight:400}
.plus10{display:block;margin:-4px auto 14px;border:0;border-radius:20px;padding:8px 24px;font-size:1.2rem;background:#d1fae5;color:#065f46;font-family:inherit;font-weight:700}
.counter:active{transform:scale(.96)}
.nav{display:flex;justify-content:space-between}
.nav button{font-family:inherit;font-size:.9rem;border:0;border-radius:10px;padding:5px 13px;background:#e5e7eb;font-weight:700}
.card.quran{font-size:1.25rem;font-weight:700;line-height:2.2}
.card.quran.kursi{font-size:1.1rem}
.card.quran.small{font-size:1rem;line-height:2}
.sname{text-align:center;color:#059669;font-weight:700;font-size:.8rem;margin:-6px 0 8px}
.isti{display:block;font-size:.8rem;font-weight:700;color:#6b7280}
#installBtn2{background:transparent;box-shadow:none;color:#8b5a2b;font-size:.75rem;font-weight:700;text-decoration:underline;padding:6px 10px;white-space:nowrap}
.done{text-align:center;font-size:1.4rem;padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:22px;max-width:360px;text-align:center}
.box button{font-family:inherit;display:block;width:100%;margin-top:10px;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:1rem}
.primary{background:#10b981;color:#fff}.secondary{background:#e5e7eb}

.tap-bar{width:200px;height:5px;margin:8px auto 6px;border-radius:5px;background:#e5e7eb;overflow:hidden;display:flex;justify-content:flex-start}
.tap-bar-seg{background:transparent;gap:3px;overflow:visible}
.tap-bar-seg.many{gap:2px}
.tap-bar-seg>span{flex:1;min-width:0;height:100%;background:#e5e7eb;border-radius:3px;overflow:hidden;display:flex;justify-content:flex-start}
.tap-bar-seg .fill{height:100%;width:0;background:#3b82f6;border-radius:3px;flex:0 0 auto;transition:width .4s ease-out}
.tap-bar-cont{overflow:hidden}
.tap-bar-cont>div{height:100%;background:#3b82f6;width:0;flex:0 0 auto;border-radius:5px;transition:width .4s ease-out}
.tap-bar.no-anim .fill,.tap-bar.no-anim>div{transition:none}
#main,#sname,#meta{transition:opacity .25s ease}
#main.fade,#sname.fade,#meta.fade{opacity:0;pointer-events:none}
body.advancing .counter,body.advancing .plus10{pointer-events:none}
#landing{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#fffdf7,#f3f4f6)}
#landing.hide{display:none}
.l-ayah{max-width:520px;text-align:center;font-weight:700;font-size:1.45rem;line-height:2.1;color:#065f46}
.l-isti{display:block;font-size:1rem;color:#6b7280;margin-bottom:6px}
.l-ayah small{display:block;font-weight:400;font-size:.85rem;color:#6b7280;margin-top:4px}
.l-btns{display:flex;flex-direction:column;gap:20px;width:100%;max-width:380px}
.l-btns button{font-family:inherit;font-size:1.7rem;font-weight:700;border:0;border-radius:18px;padding:26px 10px;cursor:pointer}
.l-btns button:active{transform:translateY(3px)}
.l-m{background:linear-gradient(135deg,#fde68a,#fdba74);color:#7c2d12;box-shadow:0 4px 0 #f59e0b,0 8px 16px rgba(0,0,0,.12)}
.l-e{background:linear-gradient(135deg,#1e3a8a,#4c1d95);color:#fff;box-shadow:0 4px 0 #1e1b4b,0 8px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="landing">
  <div class="l-ayah"><span class="l-isti">أعوذ بالله من الشيطان الرجيم</span>﴿وَالذَّاكِرِينَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتِ أَعَدَّ اللَّهُ لَهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًا﴾<small>سورة الأحزاب - الآية ٣٥</small></div>
  <div class="l-btns">
    <button class="l-m" onclick="chooseType('morning')">أذكار الصباح</button>
    <button class="l-e" onclick="chooseType('evening')">أذكار المساء</button>
  </div>
</div>
<header id="hdr" class="morning">
  <h1 id="title">أذكار الصباح</h1>
  <div class="tabs">
    <button id="tabM" onclick="switchTo('morning')">الصباح</button>
    <button id="tabE" onclick="switchTo('evening')">المساء</button>
  </div>
</header>
<div class="wrap">
  <div class="progress"><div id="bar"></div></div>
  <div class="meta" id="meta"></div>
  <div class="sname" id="sname"></div>
  <div id="main">
    <div class="card" id="text"></div>
    <div style="text-align:center;line-height:1.2"><span class="rep" id="rep"></span></div>
    <div class="tap-bar" id="tapBar" aria-hidden="true"></div>
    <button class="counter" id="counter" onclick="tap()"></button>
    <button class="plus10" id="plus10" onclick="tap(10)">+10</button>
    <div class="nav">
      <button id="prevBtn" onclick="go(-1)">السابق</button>
      <button id="installBtn2" onclick="installApp()">تثبيت التطبيق على الهاتف</button>
      <button id="nextBtn" onclick="go(1)">التالي</button>
    </div>
  </div>
</div>

<div class="modal" id="resumeModal">
  <div class="box">
    <p id="resumeMsg">لم تكمل الأذكار في المرة السابقة.<br>هل تريد البدء من مكان ما توقفت، أم البدء من جديد؟</p>
    <button class="primary" onclick="resumeChoice(true)">أكمل من حيث توقفت</button>
    <button class="secondary" onclick="resumeChoice(false)">ابدأ من جديد</button>
  </div>
</div>

function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// ===== 3) حفظ مكان التوقف في localStorage =====
const KEY='azkar-progress-v2'; // كل ورد (صباح/مساء) محفوظ لوحده بتاريخ النهارده
let state={type:'morning',index:0,count:0};
function loadAll(){ try{ const o=JSON.parse(localStorage.getItem(KEY))||{}; return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function writeType(type,obj){ const all=loadAll(); all[type]=obj; try{ localStorage.setItem(KEY,JSON.stringify(all)); }catch(e){} }
function save(){ writeType(state.type,{index:state.index,count:state.count,date:todayKey(),finished:false}); }
function markFinished(){ writeType(state.type,{index:state.index,count:state.count,date:todayKey(),finished:true}); }
function loadSaved(type){ const s=loadAll()[type]; return (s && s.date===todayKey()) ? s : null; }


const TAP_BAR_SEG_MAX=33;
const TAP_BAR_FILL_MS=400;
const TAP_BAR_HOLD_MS=300;
function setBarWidths(el,useSeg,total,filled){
  if(useSeg){
    const segs=el.children;
    for(let i=0;i<segs.length;i++){
      const fill=segs[i].firstElementChild;
      if(fill) fill.style.width=i<filled?'100%':'0';
    }
  }else{
    const f=el.firstElementChild;
    if(f) f.style.width=(total?(filled/total*100):0)+'%';
  }
}
function updateTapBar(total,filled,animate){
  const el=document.getElementById('tapBar');
  if(!el) return;
  const useSeg=total<=TAP_BAR_SEG_MAX;
  const mode=(useSeg?'seg-':'cont-')+total;
  if(el.dataset.mode!==mode){
    el.dataset.mode=mode;
    el.className=useSeg?('tap-bar tap-bar-seg'+(total>10?' many':'')):'tap-bar tap-bar-cont';
    el.innerHTML='';
    if(useSeg){
      for(let i=0;i<total;i++){
        const s=document.createElement('span');
        const f=document.createElement('span');
        f.className='fill';
        s.appendChild(f);
        el.appendChild(s);
      }
    }else{
      el.appendChild(document.createElement('div'));
    }
    animate=false;
  }
  if(!animate){
    el.classList.add('no-anim');
    setBarWidths(el,useSeg,total,filled);
    void el.offsetWidth;
    el.classList.remove('no-anim');
    return;
  }
  el.classList.remove('no-anim');
  setBarWidths(el,useSeg,total,filled);
}
function render(){
  const list=AZKAR[state.type];
  const hdr=document.getElementById('hdr');
  hdr.className=state.type;
  document.getElementById('title').textContent=state.type==='morning'?'أذكار الصباح':'أذكار المساء';
  document.getElementById('tabM').classList.toggle('active',state.type==='morning');
  document.getElementById('tabE').classList.toggle('active',state.type==='evening');
  if(state.index>=list.length){
    document.getElementById('main').innerHTML='<div class="card done">تقبّل الله منك 🤍<br>أتممت '+(state.type==='morning'?'أذكار الصباح':'أذكار المساء')+'<br><button class="counter" style="width:auto;height:auto;border-radius:12px;padding:8px 30px;font-size:1.2rem;margin-top:20px" onclick="exitApp()">خروج</button></div>';
    document.getElementById('bar').style.width='100%';
    document.getElementById('meta').textContent='';document.getElementById('sname').textContent='';
    markFinished(); return;
  }
  const z=list[state.index];
  const IST='أعوذ بالله من الشيطان الرجيم';
  const tEl=document.getElementById('text');
  if(z.t.startsWith(IST)){ tEl.textContent=z.t.slice(IST.length).replace(/^\s+/,''); const sp=document.createElement('span'); sp.className='isti'; sp.textContent=IST; tEl.prepend(sp); }
  else tEl.textContent=z.t;
  document.getElementById('text').className='card'+(z.n?' quran':'')+(z.n==='أواخر سورة البقرة'?' small':'')+(z.n==='آية الكرسي'?' kursi':'');
  document.getElementById('sname').textContent=z.n||'';
  document.getElementById('installBtn2').style.display=isStandalone()?'none':'';
  document.getElementById('counter').textContent=z.c-state.count;
  const W={1:'مرة واحدة',3:'ثلاث مرات',4:'أربع مرات',7:'سبع مرات',10:'عشر مرات',100:'مائة مرة'};
  document.getElementById('rep').textContent='التكرار: '+(W[z.c]||z.c+' مرات');
  document.getElementById('plus10').style.display=z.c>=100?'block':'none';
  updateTapBar(z.c,state.count,false);
  document.getElementById('prevBtn').style.visibility=state.index===0?'hidden':'visible';
  var nb=document.getElementById('nextBtn');nb.style.visibility='visible';if(state.index===list.length-1){nb.textContent='خروج';nb.style.color='#dc2626';nb.onclick=function(){markFinished();exitApp();};}else{nb.textContent='التالي';nb.style.color='';nb.onclick=function(){go(1)};}
  document.getElementById('meta').textContent='الذكر '+(state.index+1)+' من '+list.length;
  document.getElementById('bar').style.width=(state.index/list.length*100)+'%';
  save();
}
let advancing=false;
function setAdvancing(on){
  advancing=!!on;
  document.body.classList.toggle('advancing',advancing);
}
function fadeSwap(done){
  const ids=['main','sname','meta'];
  ids.forEach(function(id){ const el=document.getElementById(id); if(el) el.classList.add('fade'); });
  setTimeout(function(){
    done();
    requestAnimationFrame(function(){
      ids.forEach(function(id){ const el=document.getElementById(id); if(el) el.classList.remove('fade'); });
    });
  },250);
}
function tap(step){
  if(advancing) return;
  const list=AZKAR[state.type];
  if(state.index>=list.length) return;
  const z=list[state.index];
  state.count=Math.min(z.c,state.count+(step||1));
  const cEl=document.getElementById('counter');
  if(cEl) cEl.textContent=String(z.c-state.count);
  updateTapBar(z.c,state.count,true);
  if(state.count>=z.c){
    setAdvancing(true);
    const nextIndex=state.index+1;
    if(nextIndex>=list.length) markFinished();
    else writeType(state.type,{index:nextIndex,count:0,date:todayKey(),finished:false});
    setTimeout(function(){
      fadeSwap(function(){
        state.index=nextIndex;
        state.count=0;
        render();
        setTimeout(function(){ setAdvancing(false); },250);
      });
    },TAP_BAR_FILL_MS+TAP_BAR_HOLD_MS);
    return;
  }
  save();
}
function go(d){
  if(advancing) return;
  state.index=Math.max(0,Math.min(AZKAR[state.type].length-1,state.index+d)); state.count=0; render();
}
const mainHTML=document.getElementById('main').innerHTML;
function switchTo(type){
  if(advancing) return;
  enterType(type);
}
// أول دخول لكل ورد في الفتحة دي: لو بدأ فيه النهارده ومخلصهوش يسأل يكمل ولا يبدأ من جديد
const enteredThisSession={};
function enterType(type){
  document.getElementById('main').innerHTML=mainHTML;
  const s=loadSaved(type);
  const partial=s && !s.finished && (s.index>0||s.count>0);
  const first=!enteredThisSession[type]; enteredThisSession[type]=true;
  document.getElementById('resumeModal').classList.remove('show');
  if(partial){
    state={type,index:s.index,count:s.count}; render();
    if(first){
      document.getElementById('resumeMsg').innerHTML='لم تكمل قراءة '+(type==='morning'?'أذكار الصباح':'أذكار المساء')+' في المرة السابقة.<br>هل تريد البدء من مكان ما توقفت، أم البدء من جديد؟';
      document.getElementById('resumeModal').classList.add('show');
    }
  }else if(s && s.finished && !first){
    state={type,index:AZKAR[type].length,count:0}; render();
  }else{
    state={type,index:0,count:0}; render();
  }
}

function exitApp(){
  window.close();
  setTimeout(function(){ if(history.length>1) history.back(); else document.body.innerHTML='<div class="done">تقبّل الله منك 🤍<br>يمكنك إغلاق التطبيق الآن</div>'; },300);
}

// ===== تثبيت التطبيق =====
let deferredPrompt=null;
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener('appinstalled',()=>{ const b=document.getElementById('installBtn2'); if(b) b.style.display='none'; });
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
  else if(/iphone|ipad/i.test(navigator.userAgent)) alert('للتثبيت على الآيفون: اضغط زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».');
  else alert('للتثبيت: افتح قائمة المتصفح (⋮) واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
  setupNotifications();
}

// ===== الإشعارات (صامتة: الصباح 8-10، والعصر 3-5) =====
async function setupNotifications(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)) return;
  if(Notification.permission==='default'){ try{ await Notification.requestPermission(); }catch(e){} }
  if(Notification.permission!=='granted') return;
  const reg=await navigator.serviceWorker.ready;
  if('periodicSync' in reg){
    try{
      const st=await navigator.permissions.query({name:'periodic-background-sync'});
      if(st.state==='granted') await reg.periodicSync.register('azkar-reminder',{minInterval:60*60*1000});
    }catch(e){ console.warn('periodicSync',e); }
  }
}
document.addEventListener('click',function once(){ document.removeEventListener('click',once); setupNotifications(); });

let pending=null;
function resumeChoice(yes){
  document.getElementById('resumeModal').classList.remove('show');
  if(!yes){ document.getElementById('main').innerHTML=mainHTML; state={type:state.type,index:0,count:0}; render(); }
}

(function start(){
  try{ localStorage.removeItem('azkar_progress'); }catch(e){}
  // صفحة البداية: المستخدم يختار الصباح أو المساء بنفسه
})();
function chooseType(type){
  document.getElementById('landing').classList.add('hide');
  enterType(type);
}

// ===== 1) منع إطفاء الشاشة =====
(function(){
  let wakeLock=null, timer=null;
  function fallbackOn(){ if(!timer) timer=setInterval(function(){ window.scrollBy(0,0); },15000); }
  function fallbackOff(){ if(timer){ clearInterval(timer); timer=null; } }
  async function req(){
    if(!('wakeLock' in navigator)){ fallbackOn(); return; }
    try{
      wakeLock=await navigator.wakeLock.request('screen');
      fallbackOff();
      wakeLock.addEventListener('release',function(){ wakeLock=null; });
    }catch(e){ console.warn('Wake Lock:',e.name,e.message); fallbackOn(); }
  }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&!wakeLock) req(); });
  ['click','touchstart'].forEach(function(ev){ document.addEventListener(ev,function(){ if(!wakeLock) req(); },{passive:true}); });
  req();
})();
