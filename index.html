<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Cairo',sans-serif;margin:0;background:#f3f4f6;color:#1f2937}
header{padding:14px;text-align:center;color:#fff}
header.morning{background:linear-gradient(135deg,#f59e0b,#f97316)}
header.evening{background:linear-gradient(135deg,#1e3a8a,#4c1d95)}
h1{margin:0;font-size:1.4rem}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tabs button{font-family:inherit;border:0;border-radius:20px;padding:6px 16px;background:rgba(255,255,255,.25);color:#fff;font-weight:700}
.tabs button.active{background:#fff;color:#111}
.wrap{max-width:640px;margin:auto;padding:14px}
.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:6px}
.progress div{height:100%;background:#10b981;width:0;transition:width .3s}
.meta{text-align:center;font-size:.9rem;color:#6b7280;margin-bottom:10px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);min-height:220px;white-space:pre-line;font-size:1.25rem;line-height:2.1;text-align:center}
.counter{margin:8px auto 18px;width:130px;height:130px;border-radius:50%;border:0;background:#10b981;color:#fff;font-family:inherit;font-size:2.2rem;font-weight:700;display:block;box-shadow:0 4px 12px rgba(16,185,129,.4)}
.rep{display:inline-block;margin-top:14px;background:#f3f4f6;color:#9ca3af;border-radius:14px;padding:3px 14px;font-size:.95rem;font-weight:400}
.plus10{display:block;margin:-4px auto 14px;border:0;border-radius:20px;padding:8px 24px;font-size:1.2rem;background:#d1fae5;color:#065f46;font-family:inherit;font-weight:700}
.counter:active{transform:scale(.96)}
.nav{display:flex;justify-content:space-between}
.nav button{font-family:inherit;border:0;border-radius:10px;padding:8px 18px;background:#e5e7eb;font-weight:700}
.done{text-align:center;font-size:1.4rem;padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:22px;max-width:360px;text-align:center}
.box button{font-family:inherit;display:block;width:100%;margin-top:10px;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:1rem}
.primary{background:#10b981;color:#fff}.secondary{background:#e5e7eb}
</style>
</head>
<body>
<header id="hdr" class="morning">
  <h1 id="title">أذكار الصباح</h1>
  <div class="tabs">
    <button id="tabM" onclick="switchTo('morning')">الصباح</button>
    <button id="tabE" onclick="switchTo('evening')">المساء</button>
  </div>
</header>
<div class="wrap">
  <div class="progress"><div id="bar"></div></div>
  <div class="meta" id="meta"></div>
  <div id="main">
    <div class="card" id="text"></div>
    <div style="text-align:center"><span class="rep" id="rep"></span></div>
    <button class="counter" id="counter" onclick="tap()"></button>
    <button class="plus10" id="plus10" onclick="tap(10)">+10</button>
    <div class="nav">
      <button onclick="go(-1)">السابق</button>
      <button id="nextBtn" onclick="go(1)">التالي</button>
    </div>
  </div>
</div>

<div class="modal" id="resumeModal">
  <div class="box">
    <p id="resumeMsg">لم تكمل الأذكار في المرة السابقة.<br>هل تريد البدء من مكان ما توقفت، أم البدء من جديد؟</p>
    <button class="primary" onclick="resumeChoice(true)">أكمل من حيث توقفت</button>
    <button class="secondary" onclick="resumeChoice(false)">ابدأ من جديد</button>
  </div>
</div>

// ===== 2) اختيار الأذكار حسب ساعة الموبايل =====
function periodByClock(){ return new Date().getHours()<15 ? 'morning' : 'evening'; }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// ===== 3) حفظ مكان التوقف في localStorage =====
const KEY='azkar_progress';
let state={type:'morning',index:0,count:0};
function save(){ localStorage.setItem(KEY,JSON.stringify({...state,date:todayKey(),finished:false})); }
function markFinished(){ localStorage.setItem(KEY,JSON.stringify({...state,date:todayKey(),finished:true})); }
function loadSaved(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }

function render(){
  const list=AZKAR[state.type];
  const hdr=document.getElementById('hdr');
  hdr.className=state.type;
  document.getElementById('title').textContent=state.type==='morning'?'أذكار الصباح':'أذكار المساء';
  document.getElementById('tabM').classList.toggle('active',state.type==='morning');
  document.getElementById('tabE').classList.toggle('active',state.type==='evening');
  if(state.index>=list.length){
    document.getElementById('main').innerHTML='<div class="card done">تقبّل الله منك 🤍<br>أتممت '+(state.type==='morning'?'أذكار الصباح':'أذكار المساء')+'<br><button class="counter" style="width:auto;height:auto;border-radius:12px;padding:8px 30px;font-size:1.2rem;margin-top:20px" onclick="exitApp()">خروج</button></div>';
    document.getElementById('bar').style.width='100%';
    document.getElementById('meta').textContent='';
    markFinished(); return;
  }
  const z=list[state.index];
  document.getElementById('text').textContent=z.t;
  document.getElementById('counter').textContent=z.c-state.count;
  const W={1:'مرة واحدة',3:'ثلاث مرات',4:'أربع مرات',7:'سبع مرات',10:'عشر مرات',100:'مائة مرة'};
  document.getElementById('rep').textContent='التكرار: '+(W[z.c]||z.c+' مرات');
  document.getElementById('plus10').style.display=z.c>=100?'block':'none';
  document.getElementById('nextBtn').style.visibility=state.index===list.length-1?'hidden':'visible';
  document.getElementById('meta').textContent='الذكر '+(state.index+1)+' من '+list.length;
  document.getElementById('bar').style.width=(state.index/list.length*100)+'%';
  save();
}
function tap(step){
  const z=AZKAR[state.type][state.index];
  state.count=Math.min(z.c,state.count+(step||1));
  if(navigator.vibrate) navigator.vibrate(30);
  if(state.count>=z.c){ state.index++; state.count=0; }
  render();
}
function go(d){ state.index=Math.max(0,Math.min(AZKAR[state.type].length-1,state.index+d)); state.count=0; render(); }
const mainHTML=document.getElementById('main').innerHTML;
function switchTo(type){ document.getElementById('main').innerHTML=mainHTML; state={type,index:0,count:0}; render(); }

function exitApp(){
  window.close();
  setTimeout(function(){ if(history.length>1) history.back(); else document.body.innerHTML='<div class="done">تقبّل الله منك 🤍<br>يمكنك إغلاق التطبيق الآن</div>'; },300);
}
let pending=null;
function resumeChoice(yes){
  document.getElementById('resumeModal').classList.remove('show');
  if(yes){ state={type:pending.type,index:pending.index,count:pending.count}; render(); }
  else switchTo(periodByClock());
}

(function start(){
  const type=periodByClock();
  const s=loadSaved();
  if(s && !s.finished && s.date===todayKey() && s.type===type && (s.index>0||s.count>0)){
    pending=s; state.type=type; render();
    document.getElementById('resumeModal').classList.add('show');
  } else switchTo(type);
})();

// ===== 1) منع إطفاء الشاشة =====
(function(){
  let wakeLock=null, timer=null;
  function fallbackOn(){ if(!timer) timer=setInterval(function(){ window.scrollBy(0,0); },15000); }
  function fallbackOff(){ if(timer){ clearInterval(timer); timer=null; } }
  async function req(){
    if(!('wakeLock' in navigator)){ fallbackOn(); return; }
    try{
      wakeLock=await navigator.wakeLock.request('screen');
      fallbackOff();
      wakeLock.addEventListener('release',function(){ wakeLock=null; });
    }catch(e){ console.warn('Wake Lock:',e.name,e.message); fallbackOn(); }
  }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&!wakeLock) req(); });
  ['click','touchstart'].forEach(function(ev){ document.addEventListener(ev,function(){ if(!wakeLock) req(); },{passive:true}); });
  req();
})();
</script>
